name: Build CHIZI sing-box ARM64 (ebpf-inbound)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "CHIZI branch / tag / commit"
        required: true
        default: "ebpf-inbound"
        type: string

permissions:
  contents: write

concurrency:
  group: chizi-sing-box-build-ebpf-inbound
  cancel-in-progress: true

env:
  SOURCE_REPO: CHIZI-0618/sing-box
  BUILD_TAGS: with_ebpf,with_quic,with_utls,with_clash_api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. 确定源码分支 / Tag / Commit
      # ============================================================
      - name: Resolve source ref
        id: ref
        shell: bash
        env:
          INPUT_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          REF="${INPUT_REF}"
          if [[ -z "${REF}" ]]; then
            echo "ERROR: source_ref is empty" >&2
            exit 1
          fi

          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "Source ref: ${REF}"

      # ============================================================
      # 2. Checkout CHIZI
      #
      # fetch-depth: 0 用于获取完整历史和 tags
      # ============================================================
      - name: Checkout CHIZI
        uses: actions/checkout@v5
        with:
          repository: CHIZI-0618/sing-box
          ref: ${{ steps.ref.outputs.value }}
          path: source
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # 3. 读取版本和源码信息
      #
      # 版本基准 = 离当前 commit 最近、且可达的 v* tag
      # ============================================================
      - name: Read build metadata
        id: meta
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"

          BASE_TAG="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [[ -z "${BASE_TAG}" ]]; then
            echo "ERROR: no sing-box version tag reachable from HEAD" >&2
            exit 1
          fi

          BASE_VERSION="${BASE_TAG#v}"
          VERSION="${BASE_VERSION}-chizi-ebpf-inbound.${SHORT_SHA}"
          RELEASE_TAG="chizi-ebpf-inbound-${BASE_VERSION}-${SHORT_SHA}"

          COMMIT_DATE="$(git show -s --format=%cI HEAD)"
          COMMIT_SUBJECT="$(git show -s --format=%s HEAD)"
          DELIM="EOF_$(openssl rand -hex 8)"

          {
            echo "sha=${SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "base_tag=${BASE_TAG}"
            echo "base_version=${BASE_VERSION}"
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "commit_date=${COMMIT_DATE}"
            echo "commit_subject<<${DELIM}"
            echo "${COMMIT_SUBJECT}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Source       : ${SOURCE_REPO}"
          echo "Commit       : ${SHA}"
          echo "Base tag     : ${BASE_TAG}"
          echo "Build version: ${VERSION}"
          echo "Release tag  : ${RELEASE_TAG}"
          echo "========================================"

      # ============================================================
      # 4. 检查当前版本是否已经发布
      # ============================================================
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already built: ${RELEASE_TAG}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New build: ${RELEASE_TAG}"
          fi

      # ============================================================
      # 5. Go
      # ============================================================
      - name: Setup Go
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      # ============================================================
      # 6. 运行 eBPF 相关测试
      #
      # - include 包的测试需要 with_ebpf tag 才能注册 ebpf inbound
      # - protocol/ebpf 包含多个 *_test.go
      # ============================================================
      - name: Test eBPF
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          go test -count=1 -tags "with_ebpf" \
            ./include \
            ./option \
            ./protocol/ebpf

      # ============================================================
      # 7. 编译 Linux ARM64
      # ============================================================
      - name: Build Linux ARM64
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          SHARED_LDFLAGS="$(tr -d '\n' < release/LDFLAGS)"

          echo "========================================"
          echo "Target : ${GOOS}/${GOARCH}"
          echo "CGO    : ${CGO_ENABLED}"
          echo "Tags   : ${BUILD_TAGS}"
          echo "Version: ${VERSION}"
          echo "========================================"

          go build \
            -trimpath \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${SHARED_LDFLAGS} -s -w -buildid=" \
            -o dist/sing-box-linux-arm64 \
            ./cmd/sing-box

      # ============================================================
      # 8. 验证 ARM64 二进制并生成 checksum
      # ============================================================
      - name: Validate binary
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/sing-box-linux-arm64

          FILE_INFO="$(file dist/sing-box-linux-arm64)"
          echo "${FILE_INFO}"

          if ! grep -Eqi 'ARM aarch64|ARM64|aarch64' <<< "${FILE_INFO}"; then
            echo "ERROR: binary is not ARM64" >&2
            exit 1
          fi

          if grep -qi "dynamically linked" <<< "${FILE_INFO}"; then
            echo "ERROR: binary is dynamically linked" >&2
            exit 1
          fi

          cd dist
          sha256sum sing-box-linux-arm64 > sing-box-linux-arm64.sha256

          ls -lh sing-box-linux-arm64
          cat sing-box-linux-arm64.sha256

      # ============================================================
      # 9. build-info
      # ============================================================
      - name: Create build info
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        env:
          REF: ${{ steps.ref.outputs.value }}
          SHA: ${{ steps.meta.outputs.sha }}
          COMMIT_DATE: ${{ steps.meta.outputs.commit_date }}
          COMMIT_SUBJECT: ${{ steps.meta.outputs.commit_subject }}
          BASE_TAG: ${{ steps.meta.outputs.base_tag }}
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "Repository: ${SOURCE_REPO}"
            echo "Ref: ${REF}"
            echo "Commit: ${SHA}"
            echo "Commit date: ${COMMIT_DATE}"
            echo "Commit subject: ${COMMIT_SUBJECT}"
            echo "Base tag: ${BASE_TAG}"
            echo "Base version: ${BASE_VERSION}"
            echo "Build version: ${VERSION}"
            echo "Target: linux/arm64"
            echo "CGO_ENABLED: 0"
            echo "Build tags: ${BUILD_TAGS}"
          } > dist/build-info.txt

          cat dist/build-info.txt

      # ============================================================
      # 10. 发布 Release
      # ============================================================
      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ steps.ref.outputs.value }}
          SHA: ${{ steps.meta.outputs.sha }}
          COMMIT_DATE: ${{ steps.meta.outputs.commit_date }}
          COMMIT_SUBJECT: ${{ steps.meta.outputs.commit_subject }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "## CHIZI sing-box ARM64 (ebpf-inbound)"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Source: \`${SOURCE_REPO}\`"
            echo "- Ref: \`${REF}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Commit date: \`${COMMIT_DATE}\`"
            echo "- Commit subject: ${COMMIT_SUBJECT}"
            echo "- Target: \`linux/arm64\`"
            echo "- CGO: \`disabled\`"
            echo "- Build tags: \`${BUILD_TAGS}\`"
          } > /tmp/release-notes.md

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            dist/sing-box-linux-arm64 \
            dist/sing-box-linux-arm64.sha256 \
            dist/build-info.txt
