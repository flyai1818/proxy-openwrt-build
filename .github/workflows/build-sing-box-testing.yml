name: Build sing-box Linux ARM64 (Official Testing)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要编译的分支、Tag 或 Commit（例如: testing, v1.14.0-beta.9, main, 或具体 Commit）'
        required: true
        default: 'testing'

jobs:
  build:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 确定编译目标
      # ============================================================
      - name: Determine Target Ref
        id: get_ref
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ github.event.inputs.version }}"

          # schedule 运行时没有 inputs.version
          if [ -z "${REF}" ]; then
            REF="testing"
          fi

          echo "Target ref: ${REF}"
          echo "target_ref=${REF}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 2. Checkout 官方 sing-box
      #
      # 必须 fetch-depth: 0
      # 官方版本生成需要完整 Tag / Git 历史
      # ============================================================
      - name: Checkout Official SagerNet/sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.get_ref.outputs.target_ref }}
          fetch-depth: 0

      # ============================================================
      # 3. Setup Go
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ============================================================
      # 4. 获取官方版本号
      #
      # 注意：
      # 此时运行的是 Go 源码，因此是在 GitHub Runner 的 amd64
      # 环境运行，不涉及 ARM64 二进制执行问题。
      #
      # Tag:
      #   v1.14.0-beta.9
      #   -> 1.14.0-beta.9
      #
      # testing HEAD:
      #   -> 1.14.0-beta.9-xxxxxxx
      # ============================================================
      - name: Determine Official Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(
            go run github.com/sagernet/sing-box/cmd/internal/read_tag@latest
          )"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Unable to determine sing-box version."
            exit 1
          fi

          echo "Official sing-box version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. 显示源码信息
      # ============================================================
      - name: Show Source Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Target ref : ${{ steps.get_ref.outputs.target_ref }}"
          echo "Version    : ${{ steps.version.outputs.version }}"
          echo "Commit     : $(git rev-parse HEAD)"
          echo "Short hash : $(git rev-parse --short HEAD)"
          echo "========================================"

          echo
          echo "Git describe:"
          git describe --tags --always

          echo
          echo "Go version:"
          go version

      # ============================================================
      # 6. 编译 Linux ARM64
      #
      # 使用 sing-box 官方 Makefile。
      # 官方 Makefile 会使用自己的 read_tag 自动注入版本号。
      # ============================================================
      - name: Build Binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          echo "Building sing-box ${{ steps.version.outputs.version }}"
          echo "Target: ${GOOS}/${GOARCH}"

          make build \
            TAGS="with_quic,with_utls,with_clash_api"

          mv sing-box sing-box-linux-arm64
          chmod +x sing-box-linux-arm64

      # ============================================================
      # 7. 验证文件架构
      #
      # 不能执行 ARM64 二进制，
      # 但可以确认生成的确实是 ARM64 ELF。
      # ============================================================
      - name: Verify Binary Architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          file sing-box-linux-arm64
          echo "========================================"

          file sing-box-linux-arm64 | grep -q "ARM aarch64" || {
            echo "ERROR: Binary is not Linux ARM64."
            exit 1
          }

          echo "Binary architecture verified: Linux ARM64"
          echo "Version: ${{ steps.version.outputs.version }}"

      # ============================================================
      # 8. 上传 Artifact
      #
      # testing 示例：
      # sing-box-linux-arm64-1.14.0-beta.9-abcdef1
      #
      # Tag 示例：
      # sing-box-linux-arm64-1.14.0-beta.9
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ steps.version.outputs.version }}
          path: sing-box-linux-arm64
          compression-level: 9
          if-no-files-found: error
