name: Build sing-box Linux ARM64 (testing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build linux/arm64 from testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. 获取官方最新 alpha (prerelease) 的 tag，作为版本号
      # ============================================================
      - name: Resolve latest alpha version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG=$(gh api repos/SagerNet/sing-box/releases \
            --jq '[.[] | select(.prerelease == true)][0].tag_name')

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "ERROR: no prerelease found" >&2
            exit 1
          fi

          VER="${TAG#v}"
          echo "Latest alpha tag: ${TAG}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 2. 浅克隆 testing 分支到子目录 src/
      # ============================================================
      - name: Clone testing branch
        run: |
          set -euo pipefail

          git clone --depth 1 --branch testing \
            https://github.com/SagerNet/sing-box.git src

          COMMIT=$(git -C src rev-parse --short HEAD)
          echo "Testing commit: ${COMMIT}"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_ENV"

      # ============================================================
      # 3. Setup Go (使用项目 go.mod 声明的版本)
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # ============================================================
      # 4. 编译 Linux ARM64
      # ============================================================
      - name: Build binary
        working-directory: src
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          echo "Building sing-box ${VER} (testing ${COMMIT})"

          go build -v -trimpath \
            -tags "with_quic,with_utls,with_clash_api" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VER} -s -w -buildid=" \
            -o sing-box-linux-arm64 ./cmd/sing-box

          chmod +x sing-box-linux-arm64

      # ============================================================
      # 5. 验证架构
      # ============================================================
      - name: Verify binary architecture
        working-directory: src
        run: |
          set -euo pipefail
          file sing-box-linux-arm64 | grep -q "ARM aarch64" || {
            echo "ERROR: binary is not Linux ARM64" >&2
            exit 1
          }
          echo "Binary verified."

      # ============================================================
      # 6. 上传 Artifact (名字包含版本号和 testing commit)
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ steps.meta.outputs.version }}-${{ env.COMMIT }}
          path: src/sing-box-linux-arm64
          compression-level: 9
          if-no-files-found: error
