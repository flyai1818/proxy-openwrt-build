name: Build sing-box Linux ARM64 (Official Testing)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译目标 (latest-prerelease 或 testing 分支)'
        required: true
        default: 'latest-prerelease'
        type: choice
        options:
          - latest-prerelease
          - testing

jobs:
  build:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 确定编译对象与版本号 (自动识别最新 prerelease Tag)
      # ============================================================
      - name: Resolve Target & Version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CHOSEN="${{ github.event.inputs.target }}"

          if [ "${CHOSEN}" = "latest-prerelease" ]; then
            # 获取官方最新发布的 tag（例如 v1.15.0-alpha.9）
            TAG=$(gh api repos/SagerNet/sing-box/releases --jq '.[0].tag_name')
            REF="${TAG}"
            VER="${TAG#v}"
          else
            REF="testing"
            VER=""
          fi

          echo "Selected ref: ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 2. 深度为 1 纯净克隆（彻底根除 Tag / 分支刷屏）
      # ============================================================
      - name: Checkout Code
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ steps.meta.outputs.ref }}"
          echo "Cloning SagerNet/sing-box at ${REF}..."

          git clone --quiet --depth 1 --branch "${REF}" https://github.com/SagerNet/sing-box.git .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ============================================================
      # 3. Setup Go (最新稳定版)
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # ============================================================
      # 4. 确定最终注入的版本号
      # ============================================================
      - name: Determine Version
        id: final_version
        shell: bash
        run: |
          set -euo pipefail

          VER="${{ steps.meta.outputs.version }}"

          # 如果选的是 testing 分支，版本号追加 short commit
          if [ -z "${VER}" ]; then
            SHORT_COMMIT=$(git rev-parse --short HEAD)
            # 抓取 go.mod 或用内部 read_tag，兜底拼上 commit
            BASE_TAG=$(gh api repos/SagerNet/sing-box/releases --jq '.[0].tag_name' | sed 's/^v//')
            VER="${BASE_TAG}-${SHORT_COMMIT}"
          fi

          echo "Final Version: ${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. 编译 Linux ARM64
      # ============================================================
      - name: Build Binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          VER="${{ steps.final_version.outputs.version }}"
          echo "Building sing-box version: ${VER}"
          echo "Target: ${GOOS}/${GOARCH}"

          # 直接通过 -ldflags 注入准确版本号，无需依赖 makefile 内部缓慢且容易出错的 git 解析
          make build \
            VERSION="${VER}" \
            TAGS="with_quic,with_utls,with_clash_api"

          mv sing-box sing-box-linux-arm64
          chmod +x sing-box-linux-arm64

      # ============================================================
      # 6. 验证二进制
      # ============================================================
      - name: Verify Binary Architecture
        shell: bash
        run: |
          set -euo pipefail
          file sing-box-linux-arm64 | grep -q "ARM aarch64" || {
            echo "ERROR: Binary is not Linux ARM64."
            exit 1
          }
          echo "Binary verified successfully."

      # ============================================================
      # 7. 上传 Artifact
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ steps.final_version.outputs.version }}
          path: sing-box-linux-arm64
          compression-level: 9
          if-no-files-found: error
