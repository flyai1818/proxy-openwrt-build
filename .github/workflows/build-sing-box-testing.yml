name: Build sing-box Linux ARM64 (Official Testing)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout 官方 sing-box testing 分支
      # 必须 fetch-depth: 0，read_tag 解析版本需要完整 Git 历史
      # ============================================================
      - name: Checkout Official SagerNet/sing-box (testing)
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: testing
          fetch-depth: 0

      # ============================================================
      # 2. Setup Go (最新稳定版)
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # ============================================================
      # 3. 抓取官方版本号
      # 直接执行当前检出工作区中的 read_tag 工具
      # ============================================================
      - name: Determine Official Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(go run ./cmd/internal/read_tag)"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Unable to determine sing-box version."
            exit 1
          fi

          echo "Official sing-box version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. 显示源码信息
      # ============================================================
      - name: Show Source Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Branch     : testing"
          echo "Version    : ${{ steps.version.outputs.version }}"
          echo "Commit     : $(git rev-parse HEAD)"
          echo "Short hash : $(git rev-parse --short HEAD)"
          echo "========================================"

          echo
          echo "Git describe:"
          git describe --tags --always

          echo
          echo "Go version:"
          go version

      # ============================================================
      # 5. 编译 Linux ARM64
      # ============================================================
      - name: Build Binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          echo "Building sing-box ${{ steps.version.outputs.version }}"
          echo "Target: ${GOOS}/${GOARCH}"

          make build \
            TAGS="with_quic,with_utls,with_clash_api"

          mv sing-box sing-box-linux-arm64
          chmod +x sing-box-linux-arm64

      # ============================================================
      # 6. 验证文件架构
      # ============================================================
      - name: Verify Binary Architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          file sing-box-linux-arm64
          echo "========================================"

          file sing-box-linux-arm64 | grep -q "ARM aarch64" || {
            echo "ERROR: Binary is not Linux ARM64."
            exit 1
          }

          echo "Binary architecture verified: Linux ARM64"
          echo "Version: ${{ steps.version.outputs.version }}"

      # ============================================================
      # 7. 上传 Artifact
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ steps.version.outputs.version }}
          path: sing-box-linux-arm64
          compression-level: 9
          if-no-files-found: error
