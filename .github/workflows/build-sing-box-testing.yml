name: Build sing-box Linux ARM64 (Official Testing)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux ARM64
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout 官方 sing-box (testing)
      # 必须 fetch-depth: 0，才能回溯到最新打的 Tag（如 v1.15.0-alpha.9）
      # show-progress: false 可保持控制台日志清爽
      # ============================================================
      - name: Checkout Official SagerNet/sing-box (testing)
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: testing
          fetch-depth: 0
          show-progress: false

      # ============================================================
      # 2. Setup Go (最新稳定版)
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # ============================================================
      # 3. 本地解析真实官方版本号
      # 直接调用当前工作区里的 read_tag 源码
      # ============================================================
      - name: Determine Official Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(go run ./cmd/internal/read_tag)"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Unable to determine sing-box version."
            exit 1
          fi

          echo "Official sing-box version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. 显示源码与版本信息确认
      # ============================================================
      - name: Show Source Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Branch     : testing"
          echo "Version    : ${{ steps.version.outputs.version }}"
          echo "Latest Tag : $(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "Commit     : $(git rev-parse HEAD)"
          echo "Short hash : $(git rev-parse --short HEAD)"
          echo "========================================"
          go version

      # ============================================================
      # 5. 编译 Linux ARM64
      # 显式传入 VERSION 变量，确保二进制内置版本与计算出的完全一致
      # ============================================================
      - name: Build Binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          TARGET_VER="${{ steps.version.outputs.version }}"
          echo "Building sing-box version: ${TARGET_VER}"
          echo "Target: ${GOOS}/${GOARCH}"

          # 显式传入 VERSION 覆盖 Makefile 里的自动抓取
          make build \
            VERSION="${TARGET_VER}" \
            TAGS="with_quic,with_utls,with_clash_api"

          mv sing-box sing-box-linux-arm64
          chmod +x sing-box-linux-arm64

      # ============================================================
      # 6. 验证文件架构
      # ============================================================
      - name: Verify Binary Architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          file sing-box-linux-arm64
          echo "========================================"

          file sing-box-linux-arm64 | grep -q "ARM aarch64" || {
            echo "ERROR: Binary is not Linux ARM64."
            exit 1
          }

          echo "Binary architecture verified: Linux ARM64"
          echo "Version: ${{ steps.version.outputs.version }}"

      # ============================================================
      # 7. 上传 Artifact
      # ============================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ steps.version.outputs.version }}
          path: sing-box-linux-arm64
          compression-level: 9
          if-no-files-found: error
